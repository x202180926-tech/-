<style>
:root{--bg:#f2f6fa;--card:#fff;--tx:#18232f;--sub:#6b7a8c;--ac:#0a7cff;--bd:#e3e9f0;--chip:#eaf3ff;--ok:#12a150;--sh:0 4px 14px rgba(20,60,110,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1218;--card:#18202a;--tx:#e8edf3;--sub:#93a0b2;--ac:#58a6ff;--bd:#263140;--chip:#1c2f47;--ok:#3ddc84;--sh:0 4px 14px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0d1218;--card:#18202a;--tx:#e8edf3;--sub:#93a0b2;--ac:#58a6ff;--bd:#263140;--chip:#1c2f47;--ok:#3ddc84;--sh:0 4px 14px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;max-width:640px;margin:0 auto;padding-bottom:48px}
header{margin:12px;padding:20px 18px 16px;border-radius:22px;color:#fff;background:linear-gradient(135deg,#0a7cff 0%,#12b5c9 55%,#4fd6a8 100%);box-shadow:var(--sh);position:relative;overflow:hidden}
header:after{content:"🌊";position:absolute;right:-6px;bottom:-18px;font-size:92px;opacity:.18}
h1{font-size:24px;margin:0 0 4px;letter-spacing:.5px}
.hs{font-size:13px;opacity:.92}
.fl{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.fl span{background:rgba(255,255,255,.22);border-radius:999px;padding:3px 10px;font-size:12px;backdrop-filter:blur(4px)}
.pr{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px}
.bar{flex:1;height:7px;background:rgba(255,255,255,.3);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;width:0;border-radius:4px;transition:width .35s}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;gap:8px;padding:8px 12px;overflow-x:auto;z-index:5}
nav button{flex:none;border:0;background:var(--card);color:var(--tx);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;box-shadow:var(--sh)}
nav button.on{color:#fff}
.t{padding:4px 12px}
.dh{margin:6px 0 14px;padding:10px 14px;border-radius:14px;background:var(--card);border-left:5px solid var(--dc);box-shadow:var(--sh);font-size:15px}
.dh b{color:var(--dc);margin-right:6px}
.tl{position:relative;margin-left:8px;padding-left:20px;border-left:2px dashed var(--bd)}
.it{position:relative;margin:0 0 14px}
.dot{position:absolute;left:-29px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--dc);border:3px solid var(--bg)}
.tm{font-weight:800;font-size:13px;color:var(--dc);font-variant-numeric:tabular-nums;margin-bottom:3px}
.cd{display:flex;gap:10px;background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--sh);transition:opacity .2s}
.it.done .cd{opacity:.5}
.it.done h3{text-decoration:line-through}
.ic{font-style:normal}
.bd{flex:1;min-width:0}
h3{font-size:15px;margin:0 0 2px;line-height:1.4}
.nt{color:var(--sub);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--chip);color:var(--ac);border-radius:8px;padding:3px 9px;font-size:12px;font-weight:600}
.pass{background:#fff1cc;color:#8a5a00}
a.nv{font-size:12px;font-weight:600;color:#fff;background:var(--dc);border-radius:8px;padding:3px 10px;text-decoration:none}
a.nv.g{background:var(--chip);color:var(--ac)}
.ck{flex:none;position:relative;width:26px;height:26px;margin-top:1px}
.ck input{position:absolute;opacity:0;width:100%;height:100%;margin:0}
.ck span{display:block;width:26px;height:26px;border-radius:50%;border:2px solid var(--bd)}
.ck input:checked+span{background:var(--ok);border-color:var(--ok)}
.ck input:checked+span:after{content:"✓";display:block;color:#fff;text-align:center;line-height:22px;font-weight:700}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 12px;box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
td{padding:8px 0;border-bottom:1px solid var(--bd)}
td:last-child{text-align:right;white-space:nowrap;font-weight:600}
.warn{font-size:12px;color:var(--sub);padding:0 18px}
</style>
</head>
<body>
